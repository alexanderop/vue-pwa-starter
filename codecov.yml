# Coverage is a readout here, never a gate.
#
# `informational: true` on every status is the whole point: this repo already
# has a gate on test quality, and it is the mutation score (docs/mutation-
# testing.md), which asks whether the tests would notice a change rather than
# whether they executed a line. A coverage percentage bolted on next to it
# would be a second, weaker gate that fails on the days someone deletes dead
# code — so these statuses report and never block.
#
# What is worth having is the per-tier picture: with `flags` in the comment
# layout, a PR shows which tier covers the changed lines. A file only the
# browser tier touches is a different situation from one only the unit tier
# touches, and the flags are what make that visible.
coverage:
  status:
    project:
      default:
        informational: true
        only_pulls: true
    patch:
      default:
        informational: true
        only_pulls: true
    changes:
      default:
        informational: true
        only_pulls: true

# `flags` shows the per-tier breakdown; `tree` the changed files.
comment:
  layout: 'diff,flags,tree'
  behavior: default
  require_changes: true

flags:
  unit:
    paths:
      - src/
    carryforward: true
  browser:
    paths:
      - src/
    carryforward: true

# Test-result uploads (JUnit) are what make flaky runs visible over time —
# see the `flaky` tag in vitest.config.ts. A test that only fails sometimes is
# invisible in any single run, which is exactly why the tag's allowlist needs
# evidence rather than intuition.
